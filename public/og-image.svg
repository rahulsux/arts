<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f0e8"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradBg)"/>
  
  <!-- Logo on left -->
  <g transform="translate(150, 150) scale(3)">
    <circle cx="100" cy="50" r="25" fill="#1f2937"/>
    <path d="M 75 70 Q 50 75 40 110 Q 35 130 45 150" stroke="#1f2937" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 125 70 Q 150 75 160 110 Q 165 130 155 150" stroke="#1f2937" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 80 90 Q 85 120 80 160 Q 78 180 90 200" stroke="#1f2937" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120 90 Q 115 120 120 160 Q 122 180 110 200" stroke="#1f2937" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text on right -->
  <g transform="translate(550, 200)">
    <!-- Main title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#1f2937">
      AruArts
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="42" fill="#92400e">
      Handcrafted Wooden
    </text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="42" fill="#92400e">
      Decor & Gifts
    </text>
    
    <!-- Tagline -->
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="28" fill="#78350f" opacity="0.8">
      Timeless craftsmanship for your home
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="40" fill="#d97706" opacity="0.2"/>
  <circle cx="80" cy="550" r="50" fill="#92400e" opacity="0.15"/>
  <rect x="1050" y="450" width="120" height="120" fill="#d97706" opacity="0.1" transform="rotate(45 1110 510)"/>
</svg>
